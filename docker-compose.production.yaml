version: "3.8"

# Extensión base: imagen, .env, volúmenes y red
x-base-config: &base-config
  image: chatwoot/chatwoot:latest
  env_file:
    - .env
  volumes:
    - storage_data:/app/storage
  networks:
    - dokploy-network

services:
  # Servicio web Rails
  rails:
    <<: *base-config
    depends_on:
      - postgres
      - redis
    expose:
      - "3000"
    entrypoint: docker/entrypoints/rails.sh
    command:
      - bundle
      - exec
      - rails
      - s
      - -p
      - "3000"
      - -b
      - "0.0.0.0"
    restart: always

  # Trabajadores Sidekiq
  sidekiq:
    <<: *base-config
    depends_on:
      - postgres
      - redis
    entrypoint: docker/entrypoints/rails.sh
    command:
      - bundle
      - exec
      - sidekiq
      - -C
      - config/sidekiq.yml
    restart: always

  # Base de datos PostgreSQL con pgvector y alias
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB:      "${POSTGRES_DATABASE}"
      POSTGRES_USER:    "${POSTGRES_USERNAME}"
      POSTGRES_PASSWORD:"${POSTGRES_PASSWORD}"
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      dokploy-network:
        aliases:
          - chatwoot-postgres

  # Redis con contraseña y alias
  redis:
    image: redis:alpine
    restart: always
    command:
      - sh
      - -c
      - redis-server --requirepass "$REDIS_PASSWORD"
    env_file:
      - .env
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      dokploy-network:
        aliases:
          - chatwoot-redis

volumes:
  storage_data:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true
