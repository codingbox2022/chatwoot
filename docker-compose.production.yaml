version: "3.8"

# Extensión base para compartir imagen, env_file, volúmenes y red
x-base: &base-config
  image: chatwoot/chatwoot:latest
  env_file:
    - .env
  volumes:
    - storage_data:/app/storage
  networks:
    - dokploy-network

services:
  # Servicio web Rails
  rails:
    <<: *base-config
    depends_on:
      - postgres
      - redis
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    restart: always

  # Trabajadores Sidekiq
  sidekiq:
    <<: *base-config
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: always

  # Base de datos PostgreSQL con pgvector y alias chatwoot-postgres
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      dokploy-network:
        aliases:
          - chatwoot-postgres

  # Redis con contraseña
  redis:
    image: redis:alpine
    restart: always
    command:
      - sh
      - -c
      - redis-server --requirepass "$REDIS_PASSWORD"
    env_file:
      - .env
    volumes:
      - redis_data:/data
    networks:
      - dokploy-network

volumes:
  storage_data:
  postgres_data:
  redis_data:

networks:
  dokploy-network:
    external: true
